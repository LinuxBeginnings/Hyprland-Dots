# Waybar only auto-discovers ~/.config/waybar by default; it has no
# knowledge of the hypr/-owned location this project migrated it to.
# Clear the packaged ExecStart and relaunch with explicit -c/-s flags
# pointing at ~/.config/hypr/waybar/{config,style.css}.
[Service]
ExecStart=
ExecStart=/usr/bin/env waybar -c %h/.config/hypr/waybar/config -s %h/.config/hypr/waybar/style.css
